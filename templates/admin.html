<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/image.png">
    <title>پنل مدیریت | استارباکس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'vazir','Yekan',Arial, Helvetica, sans-serif;
            background: #f0f2f5;
            padding: 0;
            direction: rtl;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 18px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-bottom: 25px;
            border: 1px solid #f0e8d8;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-header-left .icon-wrapper {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #1E3A34, #2d5a4a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-header-left .icon-wrapper svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .admin-header-left h1 {
            font-family: 'Digi Almas', 'Vazir', sans-serif;
            color: #1E3A34;
            font-size: 26px;
            margin: 0;
        }

        .admin-header-left .subtitle {
            color: #95a5a6;
            font-size: 13px;
            margin-top: 2px;
        }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .admin-badge {
            background: #f0e8d8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #4A3F35;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-badge svg {
            width: 14px;
            height: 14px;
            fill: #4A3F35;
        }

        .btn {
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231,76,60,0.2);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231,76,60,0.35);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(243,156,18,0.2);
        }
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243,156,18,0.35);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1E3A34, #2d5a4a);
            color: white;
            box-shadow: 0 4px 15px rgba(30,58,52,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30,58,52,0.35);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 4px 15px rgba(39,174,96,0.2);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39,174,96,0.35);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(149,165,166,0.35);
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #f0e8d8;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 28px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 14px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            background: #f8f6f2;
            color: #1E3A34;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #1E3A34, #2d5a4a);
            color: white;
            box-shadow: 0 4px 15px rgba(30,58,52,0.2);
        }

        .tab-btn .tab-count {
            background: rgba(255,255,255,0.2);
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .tab-btn.active .tab-count {
            background: rgba(255,255,255,0.25);
        }

        .tab-content {
            display: none;
            animation: fadeInTab 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ticket-admin-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #f0e8d8;
            transition: all 0.3s ease;
            border-right: 5px solid #1E3A34;
        }

        .ticket-admin-card:hover {
            box-shadow: 0 8px 35px rgba(0,0,0,0.07);
            transform: translateY(-2px);
        }

        .ticket-admin-card .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .ticket-admin-card .ticket-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ticket-id-badge {
            background: #f0e8d8;
            padding: 5px 14px;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 14px;
            color: #4A3F35;
        }

        .priority-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .priority-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .priority-low { background: #d5f5e3; color: #1a7a42; }
        .priority-normal { background: #fdebd0; color: #a04000; }
        .priority-high { background: #fadbd8; color: #922b21; }

        .ticket-date {
            color: #95a5a6;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ticket-date svg {
            width: 16px;
            height: 16px;
            fill: #95a5a6;
        }

        .status-select {
            padding: 8px 14px;
            border-radius: 10px;
            border: 2px solid #e8ddd0;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            background: white;
            transition: all 0.3s;
        }
        .status-select:focus {
            outline: none;
            border-color: #1E3A34;
        }

        .customer-info {
            color: #4A3F35;
            margin: 8px 0 12px;
            font-size: 15px;
            background: #faf8f5;
            padding: 8px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .customer-info svg {
            width: 18px;
            height: 18px;
            fill: #95a5a6;
        }

        .customer-info strong { color: #1E3A34; }

        .ticket-subject {
            font-size: 18px;
            font-weight: 700;
            color: #1E3A34;
            margin: 10px 0;
        }

        .message-content {
            background: #faf8f5;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 10px 0 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8;
            color: #444;
            border-right: 3px solid #d4a373;
        }

        .replies-box {
            background: #f8f6f2;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 15px 0;
            border: 1px solid #f0e8d8;
        }

        .replies-box .replies-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0e8d8;
        }

        .replies-box .replies-header strong {
            color: #1E3A34;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .replies-box .replies-header strong svg {
            width: 18px;
            height: 18px;
            fill: #1E3A34;
        }

        .reply-item {
            background: white;
            border-radius: 10px;
            padding: 12px 16px;
            margin: 8px 0;
            border-right: 4px solid #1E3A34;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .reply-item.admin-reply {
            border-right-color: #e74c3c;
            background: #fdf6f5;
        }

        .reply-item .reply-author {
            font-weight: 700;
            font-size: 13px;
            color: #1E3A34;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .reply-item .reply-author svg {
            width: 16px;
            height: 16px;
            fill: #1E3A34;
        }

        .reply-item .reply-author .role-badge {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .reply-item .reply-author .role-badge.admin {
            background: #e74c3c;
            color: white;
        }
        .reply-item .reply-author .role-badge.user {
            background: #1E3A34;
            color: white;
        }

        .reply-item .reply-text {
            color: #444;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .reply-item .reply-date {
            font-size: 11px;
            color: #b0a8a0;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reply-item .reply-date svg {
            width: 14px;
            height: 14px;
            fill: #b0a8a0;
        }

        .admin-reply-form {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-top: 15px;
        }

        .admin-reply-form textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #e8ddd0;
            resize: vertical;
            font-family: inherit;
            min-height: 50px;
            background: #faf8f5;
            transition: all 0.3s;
            font-size: 14px;
        }

        .admin-reply-form textarea:focus {
            outline: none;
            border-color: #1E3A34;
            background: white;
            box-shadow: 0 0 0 4px rgba(30,58,52,0.06);
        }

        .admin-reply-form button {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(39,174,96,0.2);
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-reply-form button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .admin-reply-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39,174,96,0.35);
        }

        .admin-reply-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #f0e8d8;
            transition: all 0.3s ease;
            border-right: 5px solid #3498db;
        }

        .message-card:hover {
            box-shadow: 0 8px 35px rgba(0,0,0,0.07);
            transform: translateY(-2px);
        }

        .message-card .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .message-card .message-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .message-card .message-meta .sender-name {
            font-weight: 700;
            color: #1E3A34;
            font-size: 16px;
        }

        .message-card .message-meta .sender-email {
            color: #95a5a6;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-card .message-meta .sender-email svg {
            width: 16px;
            height: 16px;
            fill: #95a5a6;
        }

        .message-card .message-meta .msg-date {
            color: #b0a8a0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-card .message-meta .msg-date svg {
            width: 14px;
            height: 14px;
            fill: #b0a8a0;
        }

        .message-card .msg-subject {
            font-size: 17px;
            font-weight: 600;
            color: #1E3A34;
            margin: 8px 0;
        }

        .message-card .msg-body {
            background: #faf8f5;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 10px 0 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8;
            color: #444;
            border-right: 3px solid #d4a373;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .delete-btn svg {
            width: 16px;
            height: 16px;
            fill: #e74c3c;
        }

        .delete-btn:hover {
            background: #fdf2f2;
            transform: scale(1.05);
        }

        .products-table-wrapper {
            background: white;
            border-radius: 16px;
            padding: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #f0e8d8;
            overflow: hidden;
        }

        .products-table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .products-table-wrapper thead {
            background: #faf8f5;
        }

        .products-table-wrapper thead th {
            padding: 16px 20px;
            text-align: right;
            font-weight: 700;
            color: #1E3A34;
            border-bottom: 2px solid #f0e8d8;
            font-size: 13px;
            white-space: nowrap;
        }

        .products-table-wrapper tbody td {
            padding: 14px 20px;
            border-bottom: 1px solid #f5f0ea;
            color: #444;
            vertical-align: middle;
        }

        .products-table-wrapper tbody tr:hover {
            background: #faf8f5;
        }

        .products-table-wrapper tbody tr:last-child td {
            border-bottom: none;
        }

        .products-table-wrapper tbody td img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .product-name-cell {
            font-weight: 600;
            color: #1E3A34;
        }

        .price-cell {
            font-weight: 700;
            color: #27ae60;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            /* حذف .product-actions .btn-sm */
        }

        .product-actions .btn-sm svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-edit {
            background: #e8f0fe;
            color: #1a73e8;
        }
        .btn-edit:hover {
            background: #d2e3fc;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #fce8e6;
            color: #c62828;
        }
        .btn-delete:hover {
            background: #f8d7da;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
            background: white;
            border-radius: 16px;
            border: 2px dashed #f0e8d8;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            fill: #95a5a6;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #1E3A34;
            font-family: 'Digi Almas', 'Vazir', sans-serif;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 15px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeInOverlay 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            max-width: 480px;
            width: 92%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes popIn {
            from { transform: scale(0.9) translateY(-20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1E3A34;
            color: white;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 99999;
            opacity: 0;
            transition: all 0.35s ease;
            max-width: 90%;
            text-align: center;
            direction: rtl;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .modal-box h2 {
            font-family: 'Digi Almas', 'Vazir', sans-serif;
            color: #1E3A34;
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .modal-box h2 svg {
            width: 28px;
            height: 28px;
            fill: #1E3A34;
        }

        .modal-box p {
            font-size: 16px;
            color: #444;
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 2px solid #e8ddd0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            text-align: right;
            background: #faf8f5;
            transition: all 0.3s;
        }

        .modal-input:focus {
            outline: none;
            border-color: #1E3A34;
            background: white;
            box-shadow: 0 0 0 4px rgba(30,58,52,0.06);
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #productModal .modal-box {
            max-width: 560px;
            text-align: right;
        }

        #productModal .form-group {
            margin-bottom: 16px;
        }

        #productModal .form-group label {
            display: block;
            font-weight: 600;
            color: #4A3F35;
            margin-bottom: 6px;
            font-size: 14px;
        }

        #productModal .form-group input,
        #productModal .form-group select,
        #productModal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8ddd0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            background: #faf8f5;
            transition: all 0.3s;
        }

        #productModal .form-group input:focus,
        #productModal .form-group select:focus,
        #productModal .form-group textarea:focus {
            outline: none;
            border-color: #1E3A34;
            background: white;
        }

        #productModal .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        #productModal .modal-buttons {
            border-top: 2px solid #f0e8d8;
            padding-top: 20px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 10px;
            }

            .admin-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 18px;
            }

            .admin-header-left {
                flex-direction: column;
                text-align: center;
            }

            .admin-header-right {
                justify-content: center;
            }

            .admin-tabs {
                flex-direction: column;
                padding: 6px;
            }

            .tab-btn {
                justify-content: center;
                padding: 10px 16px;
                font-size: 13px;
            }

            .ticket-admin-card {
                padding: 18px;
            }

            .ticket-admin-card .ticket-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-reply-form {
                flex-direction: column;
            }
            .admin-reply-form button {
                width: 100%;
                justify-content: center;
            }

            .products-table-wrapper {
                overflow-x: auto;
            }
            .products-table-wrapper table {
                font-size: 12px;
                min-width: 600px;
            }
            .products-table-wrapper thead th,
            .products-table-wrapper tbody td {
                padding: 10px 14px;
            }

            .modal-box {
                padding: 25px 20px;
                max-width: 95%;
            }

            .message-card .message-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .admin-header-left h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-header-left">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.49.37 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.22 0 .43-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/></svg>
                </div>
                <div>
                    <h1>پنل مدیریت</h1>
                    <div class="subtitle">مدیریت کامل فروشگاه</div>
                </div>
            </div>
            <div class="admin-header-right">
                <span class="admin-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    ادمین
                </span>
                <button id="logoutBtn" class="btn btn-danger">
                    <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    خروج
                </button>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="tickets">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM6 12h12v2H6zm0-3h12v2H6zm0-3h12v2H6z"/></svg>
                تیکت‌ها
                <span class="tab-count" id="ticketCount">0</span>
            </button>
            <button class="tab-btn" data-tab="messages">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                پیام‌ها
                <span class="tab-count" id="messageCount">0</span>
            </button>
            <button class="tab-btn" data-tab="products">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
                محصولات
                <span class="tab-count" id="productCount">0</span>
            </button>
            <button class="tab-btn" data-tab="orders">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
                سفارشات
                <span class="tab-count" id="orderCount">0</span>
            </button>
        </div>

        <div id="ticketsTab" class="tab-content active">
            <div class="tab-actions">
                <button id="deleteAllTicketsBtn" class="btn btn-warning">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    حذف همه تیکت‌ها
                </button>
            </div>
            <div id="ticketsContainer"></div>
        </div>

        <div id="messagesTab" class="tab-content">
            <div class="tab-actions">
                <button id="deleteAllMessagesBtn" class="btn btn-warning">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    حذف همه پیام‌ها
                </button>
            </div>
            <div id="messagesContainer"></div>
        </div>

        <div id="productsTab" class="tab-content">
            <div class="tab-actions">
                <button id="addProductBtn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    افزودن محصول جدید
                </button>
            </div>
            <div id="productsContainer"></div>
        </div>
        <div id="ordersTab" class="tab-content">
            <div class="tab-actions">
                <!-- می‌تونی بعداً دکمه حذف همه اضافه کنی -->
            </div>
            <div id="ordersContainer"></div>
        </div>  
    </div>

    <div id="passwordModal" class="modal-overlay">
        <div class="modal-box">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                ورود به پنل مدیریت
            </h2>
            <p id="passwordModalMessage">لطفاً رمز عبور مدیریت را وارد کنید:</p>
            <input type="password" id="passwordInput" class="modal-input" placeholder="••••••" autocomplete="off">
            <div class="modal-buttons">
                <button id="passwordSubmit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    تأیید
                </button>
                <button id="passwordCancel" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    انصراف
                </button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <p id="confirmModalMessage">آیا مطمئن هستید؟</p>
            <div class="modal-buttons">
                <button id="confirmYes" class="btn btn-danger">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    بله
                </button>
                <button id="confirmNo" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    خیر
                </button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay">
        <div class="modal-box">
            <p id="alertModalMessage">پیغام</p>
            <div class="modal-buttons">
                <button id="alertOk" class="btn btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    باشه
                </button>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="productModalTitle">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                افزودن محصول جدید
            </h2>
            <form id="productForm" enctype="multipart/form-data">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>نام محصول <span style="color:#e74c3c;">*</span></label>
                    <input type="text" id="prodName" required>
                </div>
                <div class="form-group">
                    <label>دسته‌بندی <span style="color:#e74c3c;">*</span></label>
                    <select id="prodCategory">
                        <option value="coffee">☕ قهوه</option>
                        <option value="cake">🍰 کیک</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>قیمت (تومان) <span style="color:#e74c3c;">*</span></label>
                    <input type="number" id="prodPrice" required>
                </div>
                <div class="form-group">
                    <label>توضیحات</label>
                    <textarea id="prodDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>توضیح کوتاه</label>
                    <input type="text" id="prodShortDesc" maxlength="200" placeholder="حداکثر ۲۰۰ کاراکتر">
                </div>
                <div class="form-group">
                    <label>مشخصات فنی</label>
                    <textarea id="prodSpecsText" rows="4" placeholder="حجم: ۴۰۰ میلی‌لیتر&#10;دمای سرو: بسیار خنک"></textarea>
                    <small style="color:#95a5a6; font-size:12px;">هر مشخصه را در یک خط بنویسید (کلید: مقدار)</small>
                </div>
                <div class="form-group">
                    <label>تصویر</label>
                    <input type="file" id="prodImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label>درصد تخفیف</label>
                    <input type="number" id="prodDiscount" value="0" min="0" max="100">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-success">
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        ذخیره
                    </button>
                    <button type="button" id="cancelProductBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        انصراف
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
