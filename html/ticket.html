<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت تیکت پشتیبانی</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'vazir','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 15px;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafbfc;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 4px rgba(52,152,219,0.1);
        }
        textarea { 
            resize: vertical; 
        }
        .submit-btn {
            background: linear-gradient(135deg, #269c28 0%, #266f19 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Yekan','vazir',Arial, Helvetica, sans-serif; 
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        .form-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .form-message a { 
            color: #0c5460; 
            font-weight: bold; 
            text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📩 ثبت تیکت پشتیبانی</h2>
        <form id="ticketForm">
            <div class="form-group">
                <label for="name">نام شما:</label>
                <input type="text" id="name" required placeholder="نام و نام خانوادگی">
            </div>
            <div class="form-group">
                <label for="email">ایمیل شما:</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label for="subject">موضوع:</label>
                <input type="text" id="subject" required placeholder="موضوع تیکت">
            </div>
            <div class="form-group">
                <label for="message">شرح مشکل:</label>
                <textarea id="message" rows="5" required placeholder="توضیح کامل..."></textarea>
            </div>
            <div class="form-group">
                <label for="priority">اولویت:</label>
                <select id="priority">
                    <option value="low">کم</option>
                    <option value="normal" selected>معمولی</option>
                    <option value="high">بالا</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">ارسال تیکت</button>
        </form>
        <div id="formMessage" class="form-message"></div>
    </div>

<script src="../JS/script.js"></script>
</body>
</html>
